import com.vanniktech.maven.publish.SonatypeHost

plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'com.vanniktech.maven.publish'
}

android {
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34

        versionCode 200
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    namespace 'com.nilac.emdkloader'
}

dependencies {

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'

    // EMDK is exposed transitively so you don't need to redeclare it in your project!
    api 'com.symbol:emdk:11.0.134'
}

mavenPublishing {
    // Upload to the Central Portal but leave the deployment staged for manual review/release.
    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL, false)
    signAllPublications()

    coordinates("dev.nilac", "emdk-loader", "2.0.0")

    pom {
        name = "EMDK Loader"
        description = "A lightweight Kotlin wrapper around Zebra's EMDK for initialising the " +
                "EMDK Manager and processing MX profiles."
        url = "https://github.com/nilac8991/emdk-loader-lib"
        inceptionYear = "2022"

        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "https://www.apache.org/licenses/LICENSE-2.0.txt"
            }
        }

        developers {
            developer {
                id = "nilac8991"
                name = "nilac8991"
                url = "https://github.com/nilac8991"
            }
        }

        scm {
            url = "https://github.com/nilac8991/emdk-loader-lib"
            connection = "scm:git:git://github.com/nilac8991/emdk-loader-lib.git"
            developerConnection = "scm:git:ssh://git@github.com/nilac8991/emdk-loader-lib.git"
        }
    }
}